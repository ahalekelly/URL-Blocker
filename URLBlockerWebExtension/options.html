<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Blocker</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <h1>Blocklist</h1>
    </header>

    <section id="repairPanel" class="repair-panel" hidden>
      <h2>Repair Blocklist</h2>
      <p id="repairMessage"></p>
      <button id="resetButton" type="button">Reset Blocklist</button>
    </section>

    <section id="permissionPanel" class="permission-panel" hidden>
      <div class="permission-dialog">
        <h2>Website Access Required</h2>
        <p id="permissionMessage"></p>
        <p id="permissionError" class="permission-error" hidden></p>
        <button id="grantAccessButton" type="button">Allow Website Access</button>
      </div>
    </section>

    <section id="editorPanel" hidden>
      <div id="errorSummary" class="error-summary" hidden></div>

      <section id="screenTimePanel" class="settings-panel screen-time-panel">
        <div class="screen-time-panel-header">
          <h2><a class="stats-link" href="stats.html">Stats</a></h2>
          <p id="screenTimeTitle" class="screen-time-subtitle">Last 24 Hours</p>
        </div>
        <div id="screenTimeRows" class="screen-time-rows"></div>
        <p id="emptyScreenTime" class="empty-screen-time">No usage logged yet.</p>
      </section>

      <section class="settings-panel sync-panel">
        <div>
          <h2>Sync</h2>
          <p id="syncStatusText" class="sync-status-text">Checking sync.</p>
        </div>
        <div class="sync-actions">
          <button id="googleSignInButton" class="provider-button" type="button">
            <svg class="provider-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <path fill="#4285f4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.87 2.69-6.62z"></path>
              <path fill="#34a853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"></path>
              <path fill="#fbbc05" d="M3.96 10.71a5.41 5.41 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"></path>
              <path fill="#ea4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"></path>
            </svg>
            <span>Sign in with Google</span>
          </button>
          <button id="appleSignInButton" class="provider-button" type="button" hidden>
            <svg class="provider-icon apple-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M16.37 1.43c0 1.14-.47 2.22-1.22 3.04-.79.86-2.08 1.52-3.13 1.43-.13-1.09.46-2.27 1.18-3.06.8-.87 2.18-1.49 3.17-1.41zM20.69 17.04c-.57 1.32-.84 1.91-1.58 3.08-1.03 1.6-2.49 3.6-4.3 3.62-1.61.02-2.02-1.05-4.2-1.04-2.18.01-2.63 1.07-4.24 1.05-1.81-.02-3.19-1.82-4.22-3.43-2.88-4.45-3.18-9.68-1.4-12.46C2.02 5.88 4.02 4.72 5.9 4.72c1.91 0 3.11 1.05 4.69 1.05 1.53 0 2.46-1.05 4.66-1.05 1.66 0 3.43.91 4.69 2.47-4.12 2.26-3.45 8.14.75 9.85z"></path>
            </svg>
            <span>Sign in with Apple</span>
          </button>
          <button id="syncNowButton" type="button">Sync Now</button>
          <button id="signOutButton" type="button">Sign Out</button>
        </div>
      </section>

      <section class="settings-panel">
        <h2>Block Schedule</h2>
        <div class="schedule-options">
          <label class="choice-label">
            <input id="alwaysScheduleInput" type="radio" name="scheduleType" value="always">
            <span>Always</span>
          </label>
          <label class="choice-label">
            <input id="dailyScheduleInput" type="radio" name="scheduleType" value="dailyWindow">
            <span>Daily Window</span>
          </label>
        </div>
        <div id="scheduleWindowFields" class="schedule-window-fields">
          <label>
            Start
            <input id="scheduleStartInput" type="time" aria-label="Schedule start time">
          </label>
          <label>
            End
            <input id="scheduleEndInput" type="time" aria-label="Schedule end time">
          </label>
        </div>
      </section>

      <section id="limitResetPanel" class="settings-panel">
        <h2>Reset</h2>
        <div class="reset-options">
          <label class="choice-label">
            <input id="rollingResetInput" type="radio" name="limitResetType" value="rollingWindow">
            <span>Rolling Window</span>
          </label>
          <label class="choice-label">
            <input id="dailyResetInput" type="radio" name="limitResetType" value="daily">
            <span>Daily Reset</span>
          </label>
        </div>
        <div id="rollingResetFields" class="reset-fields">
          <label>
            Window Hours
            <input id="rollingWindowHoursInput" type="number" min="1" max="168" step="1" inputmode="numeric" aria-label="Rolling reset window hours">
          </label>
        </div>
        <div id="dailyResetFields" class="reset-fields">
          <label>
            Reset Time
            <select id="dailyResetHourSelect" aria-label="Daily reset time"></select>
          </label>
        </div>
      </section>

      <section class="settings-panel">
        <h2>Settings Delay</h2>
        <label>
          Delay Minutes
          <input id="settingsDelayMinutesInput" type="number" min="0" max="10080" step="1" inputmode="numeric" aria-label="Settings delay minutes">
        </label>
        <p id="settingsActivationText" class="settings-activation-text"></p>
      </section>

      <div id="rows" class="rows"></div>
      <div class="list-actions">
        <button id="addRowButton" type="button">Add Row</button>
      </div>

      <section class="settings-panel">
        <h2>Blocked Page</h2>
        <label>
          <textarea id="blockedPageHtmlInput" rows="7" spellcheck="false" aria-label="Blocked page HTML"></textarea>
        </label>
      </section>

      <button id="saveButton" class="floating-save-button" type="button" hidden>Save</button>
    </section>
  </main>

  <template id="rowTemplate">
    <article class="block-row">
      <div class="row-toolbar">
        <div class="segments" role="group" aria-label="Matcher type"></div>
        <button class="delete-button" type="button" aria-label="Delete row">Delete</button>
      </div>
      <label>
        <input class="value-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Block rule">
      </label>
      <label class="row-limit">
        Limit minutes
        <input class="limit-input" type="number" min="1" max="960" step="1" inputmode="numeric" aria-label="Limit minutes">
      </label>
      <p class="row-error" hidden></p>
    </article>
  </template>

  <script src="blocker.js"></script>
  <script src="options.js"></script>
</body>
</html>
